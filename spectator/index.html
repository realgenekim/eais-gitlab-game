<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VS Arena — Spectator</title>
    <style>
        body { margin: 0; background: #111; overflow: hidden; }
        #thegame { width: 100vw; height: 100vh; }

        /* Control panel — top-right overlay */
        #controls {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 1000;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: flex-start;
            max-width: 280px;
        }
        #controls .btn-row { display: flex; gap: 8px; width: 100%; }
        #controls .status-row { width: 100%; }
        #controls button {
            font-family: monospace;
            font-size: 13px;
            padding: 6px 14px;
            border: 1px solid #555;
            border-radius: 4px;
            cursor: pointer;
            color: #fff;
            background: rgba(30,30,40,0.85);
        }
        #controls button:hover { background: rgba(60,60,80,0.9); }
        #controls button.danger { border-color: #ff6b6b; color: #ff6b6b; }
        #controls button.danger:hover { background: rgba(255,107,107,0.2); }
        /* Status messages — bottom-right */
        #status-bar {
            position: fixed;
            bottom: 10px;
            right: 10px;
            z-index: 1000;
            color: #4ecdc4;
            font-family: monospace;
            font-size: 13px;
            background: rgba(15,15,25,0.85);
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid #333;
            display: none;
        }
        #status-bar.error { color: #ff6b6b; border-color: #ff6b6b; }

        /* Commentary subtitles */
        #subtitle-bar {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            color: #fff;
            font-family: monospace;
            font-size: 28px;
            font-weight: bold;
            background: rgba(0,0,0,0.75);
            padding: 12px 30px;
            border-radius: 8px;
            text-align: center;
            max-width: 80vw;
            display: none;
            text-shadow: 2px 2px 4px #000;
            letter-spacing: 0.05em;
        }

        /* Scoreboard sidebar */
        #scoreboard {
            position: fixed;
            top: 50px;
            right: 10px;
            z-index: 1000;
            background: rgba(15,15,25,0.9);
            border: 2px solid #333;
            border-radius: 8px;
            padding: 12px 16px;
            min-width: 200px;
            max-width: 260px;
            max-height: calc(100vh - 70px);
            overflow-y: auto;
            font-family: monospace;
            display: none;
            box-sizing: border-box;
        }
        #scoreboard h2 {
            color: #ff6b6b;
            font-size: 16px;
            margin: 0 0 10px 0;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }
        .sb-player {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid #222;
        }
        .sb-player:last-child { border-bottom: none; }
        .sb-name { color: #fff; font-size: 14px; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 120px; }
        .sb-stats { color: #aaa; font-size: 11px; text-align: right; white-space: nowrap; }
        .sb-hp { color: #4ecdc4; font-size: 14px; }
        .sb-score { color: #ffe66d; font-size: 14px; font-weight: bold; }
        .sb-dead { opacity: 0.4; }
        .sb-dead .sb-name { text-decoration: line-through; }

        /* Lobby overlay */
        #lobby-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 2000;
            background: rgba(10,10,20,0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: monospace;
        }
        #lobby-overlay.active { display: flex; }
        #lobby-title {
            font-size: 48px;
            color: #ff6b6b;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        #lobby-subtitle {
            font-size: 18px;
            color: #888;
            margin-bottom: 40px;
        }
        #lobby-roster {
            min-width: 360px;
            max-width: 500px;
        }
        #lobby-roster h3 {
            color: #4ecdc4;
            font-size: 14px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin: 0 0 12px 0;
        }
        .lobby-player {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            margin: 6px 0;
            background: rgba(40,40,60,0.8);
            border: 1px solid #333;
            border-radius: 6px;
            animation: fadeSlideIn 0.3s ease-out;
        }
        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .lobby-player-num {
            color: #ffe66d;
            font-size: 20px;
            font-weight: bold;
            margin-right: 16px;
            min-width: 30px;
        }
        .lobby-player-name {
            color: #fff;
            font-size: 18px;
            font-weight: bold;
        }
        .lobby-player-status {
            color: #4ecdc4;
            font-size: 12px;
            margin-left: auto;
        }
        #lobby-empty {
            color: #555;
            font-size: 16px;
            text-align: center;
            padding: 30px;
        }
        #start-game-btn {
            margin-top: 40px;
            font-family: monospace;
            font-size: 22px;
            font-weight: bold;
            padding: 16px 48px;
            border: 2px solid #4ecdc4;
            border-radius: 8px;
            color: #4ecdc4;
            background: rgba(78,205,196,0.1);
            cursor: pointer;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            transition: all 0.2s;
        }
        #start-game-btn:hover {
            background: rgba(78,205,196,0.25);
            box-shadow: 0 0 20px rgba(78,205,196,0.3);
        }
        #start-game-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div id="thegame"></div>

    <!-- Lobby overlay -->
    <div id="lobby-overlay">
        <div id="lobby-title">Cab Battle</div>
        <div id="lobby-subtitle">Waiting for players to join...</div>
        <div id="lobby-roster">
            <h3>Players</h3>
            <div id="lobby-players">
                <div id="lobby-empty">No players yet</div>
            </div>
        </div>
        <button id="start-game-btn" onclick="startGame()" disabled>Start Game</button>
    </div>

    <!-- Control panel (only shown in server mode) -->
    <div id="controls" style="display:none;">
        <div class="btn-row">
            <button onclick="addBot()">+ Add Bot</button>
            <button onclick="resetGame()" class="danger">Reset Game</button>
        </div>
    </div>

    <!-- Scoreboard sidebar -->
    <div id="scoreboard">
        <h2>Scoreboard</h2>
        <div id="sb-players"></div>
    </div>

    <!-- Status messages — bottom-right -->
    <div id="status-bar"></div>

    <!-- Commentary subtitles — bottom center -->
    <div id="subtitle-bar"></div>

    <script>
        const SERVER = 'http://localhost:33333';
        let botNum = 0;
        const names = ['Rick-Alpha','Rick-Beta','Rick-Gamma','Rick-Delta',
                        'Rick-Echo','Rick-Foxtrot','Rick-Golf','Rick-Hotel'];

        let currentPhase = 'lobby';

        // Show controls + scoreboard only in server mode
        if (window.location.search.includes('server')) {
            document.getElementById('controls').style.display = 'flex';
            document.getElementById('scoreboard').style.display = 'block';

            // Listen for game state from Phaser scene via custom event
            window.addEventListener('gameState', (e) => {
                const state = e.detail;
                const phase = state.phase || 'playing';

                if (phase === 'lobby') {
                    currentPhase = 'lobby';
                    document.getElementById('lobby-overlay').classList.add('active');
                    updateLobbyRoster(state.players || []);
                } else if (currentPhase === 'lobby' && phase === 'playing') {
                    // Transition from lobby to playing
                    currentPhase = 'playing';
                    document.getElementById('lobby-overlay').classList.remove('active');
                }

                if (phase === 'playing') {
                    updateScoreboard(state.players);
                }
            });

            // Check initial phase
            fetch(SERVER + '/game/status')
                .then(r => r.json())
                .then(data => {
                    if (data.phase === 'lobby') {
                        document.getElementById('lobby-overlay').classList.add('active');
                    }
                }).catch(() => {});
        }

        function updateScoreboard(players) {
            const el = document.getElementById('sb-players');
            if (!el || !players) return;
            // Sort by score descending
            const sorted = [...players].sort((a,b) => b.score - a.score);
            el.innerHTML = sorted.map(p => `
                <div class="sb-player ${p.alive ? '' : 'sb-dead'}">
                    <div>
                        <div class="sb-name">${p.name}</div>
                        <div class="sb-stats">
                            Ammo: ${p.ammo || '?'} | HP: ${p.alive ? p.hp : 0}
                        </div>
                    </div>
                    <div>
                        <div class="sb-score">${p.score} pts</div>
                        <div class="sb-hp">${p.alive ? p.hp + ' HP' : 'DEAD'}</div>
                    </div>
                </div>
            `).join('');
        }

        async function addBot() {
            const name = names[botNum % names.length];
            botNum++;
            const el = document.getElementById('status-bar');
            try {
                // Use server-side bot (aims + shoots, cleared on reset)
                const resp = await fetch(SERVER + '/game/add-bot', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({name})
                });
                const data = await resp.json();
                el.textContent = data.status === 'bot-added'
                    ? `Added ${name}` : (data.error || 'Error');
                el.className = 'status';
            } catch(e) {
                el.textContent = 'Server error: ' + e.message;
                el.className = 'status error';
            }
        }

        async function resetGame() {
            try {
                await fetch(SERVER + '/game/restart', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({})
                });
                botNum = 0;
                document.getElementById('status-bar').textContent = 'Game reset!';
            } catch(e) {
                const el = document.getElementById('status-bar');
                el.textContent = 'Server error: ' + e.message;
                el.className = 'status error';
            }
        }

        function updateLobbyRoster(players) {
            const el = document.getElementById('lobby-players');
            const btn = document.getElementById('start-game-btn');
            if (!players || players.length === 0) {
                el.textContent = '';
                const empty = document.createElement('div');
                empty.id = 'lobby-empty';
                empty.textContent = 'No players yet';
                el.appendChild(empty);
                btn.disabled = true;
                return;
            }
            btn.disabled = false;
            el.textContent = '';
            players.forEach((p, i) => {
                const row = document.createElement('div');
                row.className = 'lobby-player';

                const num = document.createElement('div');
                num.className = 'lobby-player-num';
                num.textContent = String(i + 1);

                const name = document.createElement('div');
                name.className = 'lobby-player-name';
                name.textContent = p.name;

                const status = document.createElement('div');
                status.className = 'lobby-player-status';
                status.textContent = 'READY';

                row.appendChild(num);
                row.appendChild(name);
                row.appendChild(status);
                el.appendChild(row);
            });
            document.getElementById('lobby-subtitle').textContent =
                players.length + ' player' + (players.length !== 1 ? 's' : '') + ' in lobby';
        }

        async function startGame() {
            const btn = document.getElementById('start-game-btn');
            btn.disabled = true;
            btn.textContent = 'Starting...';
            try {
                const resp = await fetch(SERVER + '/game/start', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({})
                });
                const data = await resp.json();
                if (data.status === 'started') {
                    currentPhase = 'playing';
                    document.getElementById('lobby-overlay').classList.remove('active');
                } else {
                    btn.textContent = 'Start Game';
                    btn.disabled = false;
                }
            } catch(e) {
                btn.textContent = 'Start Game';
                btn.disabled = false;
            }
        }

        // Commentary subtitle polling
        let lastCommentaryTs = 0;
        let subtitleTimeout = null;
        async function pollCommentary() {
            try {
                const resp = await fetch(SERVER + '/game/commentary');
                const data = await resp.json();
                if (data.timestamp > lastCommentaryTs && data.text) {
                    lastCommentaryTs = data.timestamp;
                    const el = document.getElementById('subtitle-bar');
                    el.textContent = data.text;
                    el.style.display = 'block';
                    if (subtitleTimeout) clearTimeout(subtitleTimeout);
                    subtitleTimeout = setTimeout(() => { el.style.display = 'none'; }, 6000);
                }
            } catch(e) {}
        }
        if (window.location.search.includes('server')) {
            setInterval(pollCommentary, 1000);
        }

        // moveBot removed — server-side bots handle their own movement + shooting
    </script>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
