<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VS Arena — Spectator</title>
    <style>
        body { margin: 0; background: #111; overflow: hidden; }
        #thegame { width: 100vw; height: 100vh; }

        /* Control panel — top-right overlay */
        #controls {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 1000;
            display: flex;
            gap: 8px;
        }
        #controls button {
            font-family: monospace;
            font-size: 13px;
            padding: 6px 14px;
            border: 1px solid #555;
            border-radius: 4px;
            cursor: pointer;
            color: #fff;
            background: rgba(30,30,40,0.85);
        }
        #controls button:hover { background: rgba(60,60,80,0.9); }
        #controls button.danger { border-color: #ff6b6b; color: #ff6b6b; }
        #controls button.danger:hover { background: rgba(255,107,107,0.2); }
        #controls .status { color: #4ecdc4; font-family: monospace; font-size: 12px; padding: 8px; }
        #controls .status.error { color: #ff6b6b; }

        /* Scoreboard sidebar */
        #scoreboard {
            position: fixed;
            top: 50px;
            right: 10px;
            z-index: 1000;
            background: rgba(15,15,25,0.9);
            border: 2px solid #333;
            border-radius: 8px;
            padding: 12px 16px;
            min-width: 220px;
            font-family: monospace;
            display: none;
        }
        #scoreboard h2 {
            color: #ff6b6b;
            font-size: 16px;
            margin: 0 0 10px 0;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }
        .sb-player {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid #222;
        }
        .sb-player:last-child { border-bottom: none; }
        .sb-name { color: #fff; font-size: 15px; font-weight: bold; }
        .sb-stats { color: #aaa; font-size: 12px; text-align: right; }
        .sb-hp { color: #4ecdc4; font-size: 14px; }
        .sb-score { color: #ffe66d; font-size: 14px; font-weight: bold; }
        .sb-dead { opacity: 0.4; }
        .sb-dead .sb-name { text-decoration: line-through; }
    </style>
</head>
<body>
    <div id="thegame"></div>

    <!-- Control panel (only shown in server mode) -->
    <div id="controls" style="display:none;">
        <button onclick="addBot()">+ Add Bot</button>
        <button onclick="resetGame()" class="danger">Reset Game</button>
        <span class="status" id="ctrl-status"></span>
    </div>

    <!-- Scoreboard sidebar -->
    <div id="scoreboard">
        <h2>Scoreboard</h2>
        <div id="sb-players"></div>
    </div>

    <script>
        const SERVER = 'http://localhost:33333';
        let botNum = 0;
        const names = ['Rick-Alpha','Rick-Beta','Rick-Gamma','Rick-Delta',
                        'Rick-Echo','Rick-Foxtrot','Rick-Golf','Rick-Hotel'];

        // Show controls + scoreboard only in server mode
        if (window.location.search.includes('server')) {
            document.getElementById('controls').style.display = 'flex';
            document.getElementById('scoreboard').style.display = 'block';

            // Listen for game state from Phaser scene via custom event
            window.addEventListener('gameState', (e) => {
                const state = e.detail;
                updateScoreboard(state.players);
            });
        }

        function updateScoreboard(players) {
            const el = document.getElementById('sb-players');
            if (!el || !players) return;
            // Sort by score descending
            const sorted = [...players].sort((a,b) => b.score - a.score);
            el.innerHTML = sorted.map(p => `
                <div class="sb-player ${p.alive ? '' : 'sb-dead'}">
                    <div>
                        <div class="sb-name">${p.name}</div>
                        <div class="sb-stats">
                            Ammo: ${p.ammo || '?'}
                        </div>
                    </div>
                    <div>
                        <div class="sb-score">${p.score} pts</div>
                        <div class="sb-hp">${p.alive ? p.hp + ' HP' : 'DEAD'}</div>
                    </div>
                </div>
            `).join('');
        }

        async function addBot() {
            const name = names[botNum % names.length];
            botNum++;
            try {
                const resp = await fetch(SERVER + '/game/join', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({name})
                });
                const data = await resp.json();
                const msg = data.message || data.error;
                document.getElementById('ctrl-status').textContent = msg;
                if (data.token) {
                    console.log(`Bot ${name}: token=${data.token}`);
                    // Auto-move the bot randomly
                    moveBot(data.token, name);
                }
            } catch(e) {
                const el = document.getElementById('ctrl-status');
                el.textContent = 'Server error: ' + e.message;
                el.className = 'status error';
            }
        }

        async function resetGame() {
            try {
                await fetch(SERVER + '/game/restart', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({})
                });
                botNum = 0;
                document.getElementById('ctrl-status').textContent = 'Game reset!';
            } catch(e) {
                const el = document.getElementById('ctrl-status');
                el.textContent = 'Server error: ' + e.message;
                el.className = 'status error';
            }
        }

        function moveBot(token, name) {
            const dirs = ['north','south','east','west'];
            const iv = setInterval(async () => {
                const dir = dirs[Math.floor(Math.random() * 4)];
                try {
                    await fetch(SERVER + '/game/action', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': token
                        },
                        body: JSON.stringify({action: 'move', direction: dir})
                    });
                } catch(e) {
                    clearInterval(iv);
                }
            }, 300);
        }
    </script>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
